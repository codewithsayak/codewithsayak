<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 170" width="1280" height="170" role="img" aria-labelledby="foot-title foot-desc">
  <title id="foot-title">Sayak Karmakar — closing plate</title>
  <desc id="foot-desc">A minimal burgundy footer with a travelling hairline and the line Designing quietly, shipping deliberately.</desc>

  <defs>
    <linearGradient id="foot-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="1" stop-color="#190B12"/>
    </linearGradient>
    <linearGradient id="foot-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foot-travel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F8F0F3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="foot-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="foot-clip">
      <rect x="0" y="33" width="1280" height="2"/>
    </clipPath>
    <style>
      @keyframes foot-drift { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
      .foot-pulse { animation: foot-drift 8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .foot-pulse { animation: none; opacity: 0.85; }
        .foot-motion { display: none; }
      }
    </style>
  </defs>

  <rect width="1280" height="170" fill="url(#foot-bg)"/>
  <ellipse cx="640" cy="150" rx="420" ry="120" fill="url(#foot-glow)"/>

  <line x1="0" y1="34" x2="1280" y2="34" stroke="url(#foot-line)" stroke-width="1"/>
  <g clip-path="url(#foot-clip)" class="foot-motion">
    <rect x="-180" y="32.5" width="180" height="3" fill="url(#foot-travel)">
      <animate attributeName="x" values="-190; 1290" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="foot-pulse">
    <rect x="633" y="27" width="14" height="14" transform="rotate(45 640 34)" fill="none" stroke="#C77B9B" stroke-opacity="0.8" stroke-width="1"/>
    <rect x="637" y="31" width="6" height="6" transform="rotate(45 640 34)" fill="#701A3D"/>
  </g>

  <text x="640" y="100" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'DejaVu Serif',serif" font-size="28" font-style="italic" fill="#E5B5C7" fill-opacity="0.9">Designing quietly, shipping deliberately.</text>

  <g font-family="ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" letter-spacing="2.4" fill="#C77B9B" fill-opacity="0.7">
    <text x="640" y="126" text-anchor="middle">SAYAK KARMAKAR · UI/UX · FULL-STACK · CREATIVE TECHNOLOGIST</text>
    <text x="640" y="148" text-anchor="middle" fill-opacity="0.55">HAND-BUILT HTML · CSS · SVG · NO TEMPLATES</text>
  </g>
</svg>
