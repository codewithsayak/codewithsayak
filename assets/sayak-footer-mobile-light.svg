<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" width="620" height="240" role="img" aria-labelledby="skml-foot-title skml-foot-desc">
  <title id="skml-foot-title">Sayak Karmakar — closing plate</title>
  <desc id="skml-foot-desc">Compact closing plate reading: Designing quietly, shipping deliberately.</desc>
  <defs>
    <linearGradient id="skml-foot-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1DEE5"/>
      <stop offset="1" stop-color="#F8F0F3"/>
    </linearGradient>
    <linearGradient id="skml-foot-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#701A3D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="skml-foot-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes skml-foot-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      .skml-foot-pulse { animation: skml-foot-pulse 8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .skml-foot-pulse { animation: none; opacity: 0.85; } }
    </style>
  </defs>

  <rect width="620" height="240" fill="url(#skml-foot-bg)"/>
  <ellipse cx="310" cy="222" rx="270" ry="105" fill="url(#skml-foot-glow)"/>
  <line x1="0" y1="40" x2="620" y2="40" stroke="url(#skml-foot-line)" stroke-width="1"/>

  <g class="skml-foot-pulse">
    <rect x="303" y="33" width="14" height="14" transform="rotate(45 310 40)" fill="none" stroke="#701A3D" stroke-opacity="0.8" stroke-width="1"/>
    <rect x="307" y="37" width="6" height="6" transform="rotate(45 310 40)" fill="#C77B9B"/>
  </g>

  <text x="310" y="132" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'DejaVu Serif',serif" font-size="27" font-style="italic" fill="#451126" fill-opacity="0.92">Designing quietly,</text>
  <text x="310" y="164" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'DejaVu Serif',serif" font-size="27" font-style="italic" fill="#451126" fill-opacity="0.92">shipping deliberately.</text>
  <g font-family="ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" letter-spacing="2.4" fill="#701A3D" fill-opacity="0.82">
    <text x="310" y="202" text-anchor="middle">SAYAK KARMAKAR</text>
  </g>
</svg>
