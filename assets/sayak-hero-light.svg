<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="skl-hero-title skl-hero-desc">
  <title id="skl-hero-title">Sayak Karmakar — UI/UX Designer, Full-Stack Developer, Creative Technologist</title>
  <desc id="skl-hero-desc">Light-theme variant of the burgundy nameplate, with a fine technical grid, restrained orbital geometry, and a glowing underline. Motion is decorative only.</desc>

  <defs>
    <linearGradient id="skl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset="0.6" stop-color="#F6E9EE"/>
      <stop offset="1" stop-color="#F1DEE5"/>
    </linearGradient>

    <radialGradient id="skl-glow-wine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="skl-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#451126"/>
      <stop offset="0.75" stop-color="#451126"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>

    <linearGradient id="skl-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="skl-rule-shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="skl-vrule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#701A3D" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>

    <pattern id="skl-grid-sm" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#701A3D" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <pattern id="skl-grid-lg" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0H0V160" fill="none" stroke="#451126" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>

    <radialGradient id="skl-grid-fade" cx="0.79" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <mask id="skl-grid-mask">
      <rect width="1280" height="360" fill="url(#skl-grid-fade)"/>
    </mask>

    <linearGradient id="skl-orbit-fade" gradientUnits="userSpaceOnUse" x1="-320" y1="0" x2="-40" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>

    <mask id="skl-orbit-mask" maskUnits="userSpaceOnUse" x="-340" y="-340" width="680" height="680">
      <rect x="-340" y="-340" width="680" height="680" fill="url(#skl-orbit-fade)"/>
    </mask>

    <clipPath id="skl-rule-clip">
      <rect x="76" y="234" width="540" height="3" rx="1.5"/>
    </clipPath>

    <filter id="skl-name-shadow" x="-10%" y="-40%" width="120%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#701A3D" flood-opacity="0.18"/>
    </filter>

    <filter id="skl-glow-blur" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <filter id="skl-dot-glow" x="-350%" y="-350%" width="800%" height="800%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>

    <style>
      @keyframes skl-drift {
        0%, 100% { transform: translate(0, 0); }
        50%      { transform: translate(22px, -14px); }
      }
      @keyframes skl-breathe {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 0.7; }
      }
      @keyframes skl-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      .skl-drift   { animation: skl-drift 19s ease-in-out infinite; }
      .skl-breathe { animation: skl-breathe 7s ease-in-out infinite; }
      .skl-spin    { animation: skl-spin 150s linear infinite; transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: reduce) {
        .skl-drift, .skl-breathe, .skl-spin { animation: none !important; }
        .skl-motion { display: none; }
      }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#skl-bg)"/>

  <g class="skl-drift">
    <ellipse cx="1004" cy="176" rx="330" ry="220" fill="url(#skl-glow-wine)"/>
  </g>

  <g mask="url(#skl-grid-mask)">
    <rect width="1280" height="360" fill="url(#skl-grid-sm)"/>
    <rect width="1280" height="360" fill="url(#skl-grid-lg)"/>
  </g>

  <line x1="716" y1="74" x2="716" y2="300" stroke="url(#skl-vrule)" stroke-width="1"/>
  <line x1="76" y1="56" x2="150" y2="56" stroke="#701A3D" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="1248" y1="56" x2="1248" y2="88" stroke="#701A3D" stroke-opacity="0.3" stroke-width="1"/>

  <g transform="translate(1012 176) rotate(-18)">
    <g mask="url(#skl-orbit-mask)">
      <circle r="258" fill="none" stroke="#701A3D" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="1 14"/>
      <circle r="204" fill="none" stroke="#451126" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 10"/>

      <ellipse rx="238" ry="106" fill="none" stroke="#701A3D" stroke-opacity="0.28" stroke-width="1"/>
      <ellipse rx="188" ry="84" fill="none" stroke="#451126" stroke-opacity="0.16" stroke-width="1"/>
      <ellipse rx="136" ry="60" fill="none" stroke="#701A3D" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 7"/>

      <g stroke="#701A3D" stroke-opacity="0.45" stroke-width="1">
        <line x1="0" y1="-272" x2="0" y2="-262"/>
        <line x1="0" y1="262" x2="0" y2="272"/>
        <line x1="-272" y1="0" x2="-262" y2="0"/>
        <line x1="262" y1="0" x2="272" y2="0"/>
      </g>

      <circle cx="0" cy="-106" r="3" fill="#701A3D"/>
      <circle cx="238" cy="0" r="2.5" fill="#C77B9B"/>
      <circle cx="-188" cy="0" r="2" fill="#C77B9B" fill-opacity="0.7"/>

      <g class="skl-motion">
        <circle r="5" fill="#C77B9B" fill-opacity="0.45" filter="url(#skl-dot-glow)">
          <animateMotion dur="26s" repeatCount="indefinite" rotate="auto"
            path="M238,0 A238,106 0 1,1 -238,0 A238,106 0 1,1 238,0"/>
        </circle>
        <circle r="2.4" fill="#701A3D">
          <animateMotion dur="26s" repeatCount="indefinite" rotate="auto"
            path="M238,0 A238,106 0 1,1 -238,0 A238,106 0 1,1 238,0"/>
        </circle>
      </g>

      <g transform="rotate(18)">
        <circle r="52" fill="#F8F0F3" stroke="#C77B9B" stroke-width="1"/>
        <circle r="43" fill="none" stroke="#701A3D" stroke-opacity="0.25" stroke-width="1"/>
        <text x="0" y="7" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'DejaVu Serif',serif" font-size="27" letter-spacing="2.5" fill="#451126">SK</text>
        <line x1="-12" y1="22" x2="12" y2="22" stroke="#701A3D" stroke-opacity="0.55" stroke-width="1"/>
      </g>

      <g class="skl-spin">
        <ellipse rx="238" ry="106" fill="none" stroke="#451126" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="34 500"/>
        <ellipse rx="188" ry="84" fill="none" stroke="#701A3D" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="16 460"/>
      </g>
    </g>
  </g>

  <rect x="76" y="103" width="6" height="6" transform="rotate(45 79 106)" fill="none" stroke="#701A3D" stroke-opacity="0.8"/>
  <text x="94" y="110" font-family="ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" letter-spacing="4.8" fill="#701A3D">DESIGN × CODE</text>

  <text x="74" y="202" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'DejaVu Serif',serif" font-size="82" letter-spacing="0.4" fill="url(#skl-name)" filter="url(#skl-name-shadow)">Sayak Karmakar</text>

  <g class="skl-breathe">
    <ellipse cx="344" cy="240" rx="268" ry="4" fill="#C77B9B" fill-opacity="0.28" filter="url(#skl-glow-blur)"/>
  </g>
  <rect x="76" y="234" width="536" height="2" rx="1" fill="url(#skl-rule)"/>
  <g clip-path="url(#skl-rule-clip)" class="skl-motion">
    <rect x="-140" y="233" width="150" height="4" fill="url(#skl-rule-shimmer)">
      <animate attributeName="x" values="-150; 600" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="76" y="272" font-family="ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14.5" letter-spacing="1.2" fill="#451126" fill-opacity="0.95">UI/UX DESIGNER · FULL-STACK DEVELOPER · CREATIVE TECHNOLOGIST</text>
  <text x="76" y="308" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'DejaVu Serif',serif" font-size="22" font-style="italic" fill="#451126" fill-opacity="0.76">Calm interfaces, built with care.</text>

  <g font-family="ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.8" fill="#701A3D" fill-opacity="0.8">
    <text x="76" y="340">INDIA · REMOTE</text>
    <circle cx="198" cy="336.5" r="1.6" fill="#C77B9B" stroke="none"/>
    <text x="214" y="340">OPEN TO COLLABORATION</text>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="359" fill="none" stroke="#701A3D" stroke-opacity="0.1"/>
</svg>
